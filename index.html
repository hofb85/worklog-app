<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkLog</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div id="loginScreen" class="login-screen">
      <section class="clock-card login-card">
        <p class="eyebrow">Urenregistratie</p>
        <h1>WorkLog</h1>
        <p class="muted dialog-copy">Log in met Google of Microsoft om je uren te zien.</p>
        <p id="loginError" class="login-error"></p>
        <div class="login-actions">
          <button id="googleBtn" class="primary" type="button">Inloggen met Google</button>
          <button id="microsoftBtn" class="ghost" type="button">Inloggen met Microsoft</button>
        </div>
      </section>
    </div>

    <div id="app" class="app hidden">
      <header class="top">
        <div>
          <p class="eyebrow">Urenregistratie</p>
          <h1>WorkLog</h1>
        </div>
        <div class="top-actions">
          <label class="month-picker">
            <span>Maand</span>
            <input id="monthInput" type="month" />
          </label>
          <button id="signOutBtn" class="ghost" type="button">Uitloggen</button>
        </div>
      </header>
      <p id="syncStatus" class="sync-status">Uren worden online bijgewerkt</p>

      <section class="clock-card">
        <div class="project-row">
          <select id="projectSelect" aria-label="Project"></select>
          <button id="newProjectBtn" class="ghost" type="button">+ Project</button>
        </div>

        <p id="clockLabel" class="clock-label">Klaar om te starten</p>
        <p id="clock" class="clock">00:00:00</p>
        <p id="monthTotal" class="month-total"></p>

        <div class="actions">
          <button id="toggleBtn" class="primary" type="button">Start klok</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Deze maand</h2>
            <p id="sessionCount" class="muted"></p>
          </div>
        </div>
        <div id="monthProjectFilter" class="filter-pills" role="tablist" aria-label="Filter op project"></div>
        <div id="dayList" class="day-list"></div>
      </section>
    </div>

    <dialog id="projectDialog">
      <form id="projectForm" method="dialog">
        <h3>Nieuw project</h3>
        <label>
          Naam
          <input id="projectName" type="text" required maxlength="80" placeholder="Bijv. Website redesign" />
        </label>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="cancelProject" class="ghost">Annuleren</button>
          <button value="ok" class="primary" type="submit">Toevoegen</button>
        </div>
      </form>
    </dialog>

    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth-compat.js"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>
